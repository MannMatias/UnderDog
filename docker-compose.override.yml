# Astro CLI combina este archivo con el docker-compose que genera para
# `astro dev start` (https://www.astronomer.io/docs/astro/cli/customize-docker-compose).
#
# source-db es la BASE FUENTE del proyecto: un PostgreSQL independiente de la
# base de metadata de Airflow (el servicio `postgres` que crea Astro). Airflow
# la consulta por la Connection `soccer_source_db` (host "source-db" dentro de
# la red `airflow`). Se carga una sola vez con el seed:
#     astro dev bash  ->  python -m include.src.source_loader
# Los datos viven en el volumen source_db_data: sobreviven a `astro dev stop`
# y `astro dev restart`.
services:
  source-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - airflow
    # Usuario, contraseña y base (no se versiona; ver source_db.env.example).
    # Es un archivo aparte de .env para que este contenedor no reciba las
    # variables de Airflow (token de Kaggle, Connection).
    env_file:
      - source_db.env
    ports:
      # 5432 ya lo usa la metadata de Airflow; desde la PC: localhost:5433.
      - "127.0.0.1:5433:5432"
    volumes:
      - source_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  source_db_data:
